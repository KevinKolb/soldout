<script>
/* Footer behaviour. Inlined into each page with the markup above by
   tools/build-footer.py, so it needs no separate request and cannot go stale
   against the markup it drives. */
(function () {
  var toggle = document.getElementById('shopToggle');
  var list = document.getElementById('shopList');
  if (toggle && list) {
    toggle.addEventListener('click', function () {
      var open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      list.hidden = open;
    });
  }
  /* The year is in the markup as a fallback and refreshed here, so a page that
     has not been rebuilt since New Year is still right in the browser. */
  Array.prototype.forEach.call(
    document.querySelectorAll('.footer-year'),
    function (el) { el.textContent = new Date().getFullYear(); }
  );
  /* Comic-book wobble on the social icons. */
  Array.prototype.forEach.call(
    document.querySelectorAll('.social-link'),
    function (link) {
      link.style.transform = 'rotate(' + ((Math.random() - 0.5) * 30) + 'deg)';
    }
  );
})();
</script>
