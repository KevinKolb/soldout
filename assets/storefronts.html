  <style>
    :root {
      --comic-red: #FF3B3B;
      --comic-blue: #4A90E2;
      --comic-yellow: #FFD93D;
      --comic-black: #2C2C2C;
      --comic-white: #FFFFFF;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--comic-black);
      background-color: var(--comic-yellow);
      background-image: radial-gradient(circle, rgba(0,0,0,0.15) 1px, transparent 1px);
      background-size: 4px 4px;
    }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem; }

    .back-link {
      position: absolute;
      top: 1.4rem;
      right: 1.5rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--comic-black);
      text-decoration: none;
      border-bottom: 2px solid var(--comic-black);
      padding-bottom: 2px;
    }
    .back-link:hover { color: var(--comic-red); border-bottom-color: var(--comic-red); }

    .hero {
      position: relative;
      background: var(--comic-white);
      border: 5px solid var(--comic-black);
      box-shadow: 10px 10px 0 rgba(0,0,0,0.2);
      padding: 3rem 2rem;
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .hero-logo {
      position: absolute;
      top: 1.1rem;
      left: 1.25rem;
      line-height: 0;
    }

    .hero-logo img { width: clamp(64px, 11vw, 120px); height: auto; display: block; }

    /* Below this the banner is too narrow for the logo to sit beside the
       headline without colliding, so it goes back into the flow. */
    @media (max-width: 620px) {
      .hero { padding-top: 1.5rem; }
      .hero-logo { position: static; margin: 0 auto 0.75rem; }
      .hero-logo img { width: 96px; }
      .back-link { position: static; display: block; margin: 0 auto 1.25rem; width: fit-content; }
    }


    .hero h1 {
      font-family: 'Bangers', cursive;
      font-size: clamp(3.6rem, 13vw, 7.5rem);
      letter-spacing: 3px;
      color: var(--comic-red);
      text-shadow: 4px 4px 0 var(--comic-black);
      margin: 0 0 1rem;
      line-height: 1;
    }

    .hero p {
      font-family: Inter, system-ui, sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--comic-black);
      max-width: 620px;
      margin: 0 auto;
      line-height: 1.4;
    }

    .hero p.hero-kicker { margin-bottom: 0.2rem; }

    .section-note { font-size: 0.9rem; margin: 0 0 1.5rem; max-width: 640px; }

    section { margin-bottom: 3.5rem; }

    .footer-bottom a { text-decoration: none; }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.25rem;
    }

    .item-card {
      display: flex;
      flex-direction: column;
      background: var(--comic-white);
      border: 4px solid var(--comic-black);
      text-decoration: none;
      color: var(--comic-black);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .item-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0 var(--comic-black);
    }

    .item-card .shot {
      aspect-ratio: 1 / 1;
      border-bottom: 4px solid var(--comic-black);
      background: #f6f6f6;
      overflow: hidden;
    }
    .item-card .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .item-card .body { padding: 0.9rem 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .item-card .item-title { font-weight: 700; font-size: 0.95rem; line-height: 1.35; }
    .item-card .meta { font-size: 0.75rem; color: #666; }
    .item-card .price {
      font-family: 'Bangers', cursive;
      font-size: 1.5rem;
      letter-spacing: 1px;
      color: var(--comic-red);
    }

    .item-badge {
      align-self: flex-start;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 2px solid var(--comic-black);
      background: var(--comic-yellow);
      padding: 2px 7px;
    }

    .item-card.sold { opacity: 0.55; }
    .item-card.sold .item-badge { background: var(--comic-black); color: #fff; }
    .item-card.sold .price { color: #888; text-decoration: line-through; }
  </style>

<script>
/* Footer behaviour. Inlined into each page with the markup above by
   tools/build-footer.py, so it needs no separate request and cannot go stale
   against the markup it drives. */
(function () {
  var toggle = document.getElementById('shopToggle');
  var list = document.getElementById('shopList');
  if (toggle && list) {
    toggle.addEventListener('click', function () {
      var open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      list.hidden = open;
    });
  }
  /* Comic-book wobble on the social icons. */
  Array.prototype.forEach.call(
    document.querySelectorAll('.social-link'),
    function (link) {
      link.style.transform = 'rotate(' + ((Math.random() - 0.5) * 30) + 'deg)';
    }
  );
})();
</script>

<script>
const text = (node, tag) => (node.querySelector(tag)?.textContent || '').trim();

async function loadInventory() {
  const grid = document.getElementById('itemGrid');
  const note = document.getElementById('itemsStatus');

  if (location.protocol === 'file:') {
    note.textContent = 'Item list needs a web server; open this page over http rather than from disk.';
    return;
  }

  let items;
  try {
    const res = await fetch('data/inventory.xml', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const doc = new DOMParser().parseFromString(await res.text(), 'text/xml');
    if (doc.querySelector('parsererror')) throw new Error('inventory.xml is not valid XML');
    items = [...doc.querySelectorAll('item')];
  } catch (err) {
    note.textContent = 'Could not load the item list right now.';
    console.warn('[shop] inventory load failed:', err);
    return;
  }

  if (!items.length) {
    note.textContent = 'Nothing listed at the moment. Check the storefronts above.';
    return;
  }

  grid.innerHTML = '';
  for (const it of items) {
    const sold = text(it, 'status').toLowerCase() === 'sold';
    const price = text(it, 'price');

    const card = document.createElement('a');
    card.className = 'item-card' + (sold ? ' sold' : '');
    card.href = text(it, 'url');
    card.target = '_blank';
    card.rel = 'noopener';

    const shot = document.createElement('div');
    shot.className = 'shot';
    const img = document.createElement('img');
    img.src = text(it, 'image') || '/assets/images/soldoutlogo.png';
    img.alt = text(it, 'title');
    img.loading = 'lazy';
    shot.appendChild(img);

    const body = document.createElement('div');
    body.className = 'body';

    const badge = document.createElement('span');
    badge.className = 'item-badge';
    badge.textContent = sold ? 'Sold' : (text(it, 'platform') || 'For sale');

    const title = document.createElement('div');
    title.className = 'item-title';
    title.textContent = text(it, 'title');

    const priceEl = document.createElement('div');
    priceEl.className = 'price';
    priceEl.textContent = price ? '$' + price : 'See listing';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = [text(it, 'condition'), text(it, 'platform')].filter(Boolean).join(' • ');

    body.append(badge, title, priceEl, meta);
    card.append(shot, body);
    grid.appendChild(card);
  }
}

loadInventory();
</script>
