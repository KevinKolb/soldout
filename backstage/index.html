<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backstage</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/assets/images/soldoutlogo.png">
    <script>
        /* Backstage is Notion now.
         *
         * This used to be a grid of cards behind a Google sign-in. The cards have moved
         * to a page in Notion, and the browser tools they pointed at have moved to
         * /tools/. What is left here is the doorway, because two things still lead to it:
         * the BACKSTAGE ACCESS link in the site footer, and backstage.soldoutcomedy.com,
         * which Cloudflare forwards to this path.
         *
         * That second one is why this must never redirect to backstage.soldoutcomedy.com.
         * It did once, while Cloudflare was pointing that subdomain here, and the two
         * bounced off each other until the browser gave up.
         *
         * Notion does its own auth, so there is no sign-in to do first.
         */
        location.replace('https://app.notion.com/p/d350ecaf50bc4f1893ba5ab53590ef3e');
    </script>
    <meta http-equiv="refresh" content="0; url=https://app.notion.com/p/d350ecaf50bc4f1893ba5ab53590ef3e">
    <style>
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #fff; color: #000; text-align: center; padding: 24px;
        }
        a { color: #000; }
    </style>
</head>
<body>
    <p>Backstage lives in Notion.<br>
       <a href="https://app.notion.com/p/d350ecaf50bc4f1893ba5ab53590ef3e">Open it</a>.</p>
</body>
</html>
