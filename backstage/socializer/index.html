<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Socializer</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="/socializer/">
    <script>
        /* The Socializer is reached directly rather than walked to from the card grid,
           so it sits at the root now. This path stays only to catch bookmarklets dragged
           to a bar while it lived under Backstage. The query string is the whole payload
           of a bookmarklet press, so it is carried across rather than dropped.
           replace() rather than assign() so Back does not bounce you straight back here. */
        location.replace('/socializer/' + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/socializer/">
</head>
<body>
    <p>Moved to <a href="/socializer/">/socializer/</a>.</p>
</body>
</html>
