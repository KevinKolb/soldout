<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>SOLD OUT! Comedy</title>
  <link rel="icon" type="image/png" href="assets/images/soldoutlogo.png">
  <link rel="apple-touch-icon" href="assets/images/soldoutlogo.png">

  <meta property="og:title" content="SOLD OUT! Comedy">
  <meta property="og:description" content="Consignment theater: live improv where the audience brings the props and everybody bids. No shows scheduled right now, but the Prop Shop is open.">
  <meta property="og:image" content="https://soldoutcomedy.com/assets/images/soldoutlogo.png">
  <meta property="og:image:alt" content="SOLD OUT! Comedy Logo">
  <meta property="og:url" content="https://soldoutcomedy.com">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SOLD OUT! Comedy">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SOLD OUT! Comedy">
  <meta name="twitter:description" content="Consignment theater: live improv where the audience brings the props and everybody bids. No shows scheduled right now, but the Prop Shop is open.">
  <meta name="twitter:image" content="https://soldoutcomedy.com/assets/images/soldoutlogo.png">
  <meta name="twitter:site" content="@soldoutcomedy">
  <meta name="twitter:creator" content="@soldoutcomedy">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers:wght@400&family=Inter:wght@300;400;600;700&display=swap">

  <style>
    :root {
      --comic-red: #FF3B3B;
      --comic-blue: #4A90E2;
      --comic-yellow: #FFD93D;
      --comic-orange: #FF9500;
      --comic-black: #2C2C2C;
      --comic-white: #FFFFFF;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--comic-yellow);
      background-image: radial-gradient(circle, rgba(0,0,0,0.15) 1px, transparent 1px);
      background-size: 4px 4px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--comic-black);
      padding: 24px;
      text-align: center;
    }

    .notice-card {
      background: var(--comic-white);
      border: 5px solid var(--comic-black);
      border-radius: 20px;
      box-shadow: 8px 8px 0 var(--comic-black);
      padding: 48px 40px;
      max-width: 560px;
    }

    .logo {
      max-width: 220px;
      width: 100%;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      letter-spacing: 2px;
      color: var(--comic-red);
      text-shadow: 3px 3px 0 var(--comic-black);
      margin: 0 0 16px;
    }

    p.tagline {
      font-size: 1.1rem;
      line-height: 1.5;
      margin: 0 0 28px;
    }

    .badge {
      display: inline-block;
      background: var(--comic-blue);
      color: var(--comic-white);
      font-family: 'Bangers', cursive;
      font-size: 1.3rem;
      letter-spacing: 1px;
      padding: 10px 28px;
      border: 4px solid var(--comic-black);
      border-radius: 999px;
      transform: rotate(-3deg);
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .badge:hover, .badge:focus-visible {
      transform: rotate(-3deg) scale(1.05);
      box-shadow: 4px 4px 0 var(--comic-black);
      outline: none;
    }
  </style>
</head>
<body>
  <div class="notice-card">
    <img src="assets/images/soldoutlogo.png" alt="SOLD OUT! Comedy" class="logo">
    <h1>No Shows Scheduled</h1>
    <p class="tagline">Nothing on the calendar at the moment. The props, however, are not
      waiting around &mdash; they are for sale right now, and every one of them is still
      hoping to end up in a scene.</p>
    <a class="badge" href="/shop/">Take a look at the Prop Shop</a>
  </div>
</body>
</html>
