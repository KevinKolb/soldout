name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Rebuild without a push, so curating on eBay or adding an Airtable row
  # reaches the site on its own.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check required secrets are set
      run: |
        missing=""
        for name in AIRTABLE_API_KEY AIRTABLE_BASE_ID AIRTABLE_TABLE_NAME \
                    EMAILJS_SERVICE_ID EMAILJS_TEMPLATE_ID EMAILJS_PUBLIC_KEY; do
          [ -z "${!name}" ] && missing="$missing $name"
        done
        if [ -n "$missing" ]; then
          echo "Missing repository secrets:$missing"
          exit 1
        fi
        echo "All six secrets are set."
      env:
        AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
        EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}

    - name: Inject credentials into show-day pages
      run: |
        python3 - <<'EOF'
        import os, pathlib
        names = ["AIRTABLE_API_KEY", "AIRTABLE_BASE_ID", "AIRTABLE_TABLE_NAME",
                 "EMAILJS_SERVICE_ID", "EMAILJS_TEMPLATE_ID", "EMAILJS_PUBLIC_KEY"]
        for target in ["live/input.html", "live/prop.html"]:
            p = pathlib.Path(target)
            text = p.read_text(encoding="utf-8")
            for n in names:
                text = text.replace("{{%s}}" % n, os.environ[n])
            p.write_text(text, encoding="utf-8")
            print(f"injected credentials into {target}")
        EOF
      env:
        AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
        EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}

    - name: Verify no placeholders remain
      run: |
        if grep -rn "{{[A-Z_]*}}" ./live/; then
          echo "Unsubstituted placeholders found above."
          exit 1
        fi
        echo "No placeholders remain."

    # Rebuilds the shop listings from the Ambassador table, enriched with live
    # title/price/image from the eBay storefront. Deliberately not a hard failure:
    # if either source is unreachable the committed inventory.xml still ships, so
    # the shop goes slightly stale rather than blank.
    - name: Build shop inventory
      continue-on-error: true
      env:
        AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      run: python3 tools/build-inventory.py

    # Re-inlines assets/footer.html into every page carrying the markers, so a
    # footer edit cannot ship half-applied if someone forgot to run it locally.
    - name: Inline shared footer
      run: python3 tools/build-footer.py

    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4