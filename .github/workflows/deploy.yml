name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Every morning at 6:15 Central, to pick up props newly listed on the eBay
  # storefront and refresh eBay's prices, photos and remaining counts. Captions, tabs
  # and status don't need it - the shop reads those from Supabase live.
  #
  # Cron only speaks UTC, and Central moves an hour with daylight saving, so both
  # UTC times are scheduled and the gate job below lets through only the one that
  # is 6:15 in Chicago today.
  schedule:
    - cron: '15 11 * * *'   # 6:15 am CDT (daylight saving)
    - cron: '15 12 * * *'   # 6:15 am CST (standard time)
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
    - id: check
      env:
        EVENT: ${{ github.event_name }}
        CRON: ${{ github.event.schedule }}
      run: |
        run=true
        if [ "$EVENT" = schedule ]; then
          zone=$(TZ=America/Chicago date +%Z)
          case "$zone|$CRON" in
            "CDT|15 11 * * *"|"CST|15 12 * * *") run=true ;;
            *) run=false ;;
          esac
          echo "Chicago is on $zone; this is the '$CRON' run; deploy=$run"
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check required secrets are set
      run: |
        missing=""
        for name in AIRTABLE_API_KEY AIRTABLE_BASE_ID AIRTABLE_TABLE_NAME \
                    EMAILJS_SERVICE_ID EMAILJS_TEMPLATE_ID EMAILJS_PUBLIC_KEY; do
          [ -z "${!name}" ] && missing="$missing $name"
        done
        if [ -n "$missing" ]; then
          echo "Missing repository secrets:$missing"
          exit 1
        fi
        echo "All six secrets are set."
      env:
        AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
        EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}

    - name: Inject credentials into show-day pages
      run: |
        python3 - <<'EOF'
        import os, pathlib
        names = ["AIRTABLE_API_KEY", "AIRTABLE_BASE_ID", "AIRTABLE_TABLE_NAME",
                 "EMAILJS_SERVICE_ID", "EMAILJS_TEMPLATE_ID", "EMAILJS_PUBLIC_KEY"]
        for target in ["live/input.html", "live/prop.html"]:
            p = pathlib.Path(target)
            text = p.read_text(encoding="utf-8")
            for n in names:
                text = text.replace("{{%s}}" % n, os.environ[n])
            p.write_text(text, encoding="utf-8")
            print(f"injected credentials into {target}")
        EOF
      env:
        AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
        EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}

    - name: Verify no placeholders remain
      run: |
        if grep -rn "{{[A-Z_]*}}" ./live/; then
          echo "Unsubstituted placeholders found above."
          exit 1
        fi
        echo "No placeholders remain."

    # Rebuilds the shop listings from the shop table in Supabase, enriched with
    # live title/price/image from the eBay storefront. Needs no secret: reading
    # that table is a public select policy and the publishable key is committed.
    # Deliberately not a hard failure: if a source is unreachable the committed
    # inventory.xml still ships, so the shop goes stale rather than blank.
    - name: Build shop inventory
      continue-on-error: true
      run: python3 tools/build-inventory.py

    # Photos for PROP POOL, from eBay's Browse API, written to
    # assets/data/pool-images.json. The two secrets are a free eBay developer
    # account's production keyset; without them the step skips. Not a hard
    # failure: without it the pool just shows blank frames.
    - name: Find PROP POOL photos
      continue-on-error: true
      run: python3 tools/build-pool-images.py
      env:
        EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
        EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}

    # Re-inlines assets/footer.html into every page carrying the markers, so a
    # footer edit cannot ship half-applied if someone forgot to run it locally.
    - name: Inline shared footer
      run: python3 tools/build-footer.py

    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4