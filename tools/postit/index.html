<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Socializer</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="/backstage/socializer/">
    <script>
        /* Post it fanned a Notion row out to every composer. Those buttons are on each card
           in the Socializer now, so nothing needs to leave the page to reach them.
           The query string is the whole payload of a bookmarklet press, so it is carried
           across rather than dropped. replace() rather than assign() so Back does not
           bounce you straight back here. */
        location.replace('/backstage/socializer/' + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/backstage/socializer/">
</head>
<body>
    <p>Moved to <a href="/backstage/socializer/">/backstage/socializer/</a>.</p>
</body>
</html>
